server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: agent-platform
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/agent_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

jwt:
  # HS256 密钥，必须通过环境变量 JWT_SECRET 注入（>=32字节随机字符串），禁止提交真实密钥
  secret: ${JWT_SECRET:}
  expire-hours: ${JWT_EXPIRE_HOURS:24}

# 公开门户（免鉴权分享页）防护
portal:
  public:
    rate-limit:
      # 匿名访问：每 IP 每分钟上限
      anon-per-minute: ${PORTAL_ANON_RATE_LIMIT:30}
      # 携带合法 API Key：每 IP 每分钟上限（应用级配额仍由 API Key 控制）
      keyed-per-minute: ${PORTAL_KEYED_RATE_LIMIT:120}

logging:
  level:
    com.agent.platform: ${LOG_LEVEL:info}
