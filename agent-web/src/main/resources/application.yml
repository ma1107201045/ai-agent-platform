server:
  port: ${SERVER_PORT:9080}

spring:
  application:
    name: agent-platform
  profiles:
    # 环境区分：dev（默认）/ prod，通过环境变量 SPRING_PROFILES_ACTIVE 切换
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: org.postgresql.Driver
    # stringtype=unspecified：让 String 字段可直接写入 vector/jsonb 等扩展类型
    # 连接信息由 profile 文件提供：application-dev.yml 含本地默认值，application-prod.yml 强制环境变量注入
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

jwt:
  # HS256 密钥：dev 有本地兜底值（application-dev.yml），prod 必须由环境变量 JWT_SECRET 注入（>=32字节随机字符串）
  secret: ${JWT_SECRET:}
  expire-hours: ${JWT_EXPIRE_HOURS:24}

platform:
  mybatis:
    # 与数据库连接的默认 schema/search_path 保持一致，避免同名表元数据串用。
    default-schema: ${MYBATIS_DEFAULT_SCHEMA:public}
  crypto:
    # 敏感字段（如模型供应商 apiKey）落库加密密钥，通过环境变量 PLATFORM_CRYPTO_SECRET 注入（>=16字符）
    # 未配置时敏感字段明文存储（仅适合本地开发）；配置后新写入数据自动加密，历史明文仍可读取
    secret: ${PLATFORM_CRYPTO_SECRET:}

# 公开门户（免鉴权分享页）防护
portal:
  public:
    rate-limit:
      # 匿名访问：每 IP 每分钟上限
      anon-per-minute: ${PORTAL_ANON_RATE_LIMIT:30}
      # 携带合法 API Key：每 IP 每分钟上限（应用级配额仍由 API Key 控制）
      keyed-per-minute: ${PORTAL_KEYED_RATE_LIMIT:120}
    # 是否信任 X-Forwarded-For / X-Real-IP 代理头识别客户端 IP。
    # 仅当部署在可信反向代理（nginx 等）之后时设为 true，否则保持 false 防伪造绕过限流
    trust-proxy: ${PORTAL_TRUST_PROXY:false}

# CORS 允许来源（逗号分隔）。本地开发默认放行 vite 端口；
# 生产环境必须通过环境变量 CORS_ALLOWED_ORIGINS 收窄到实际前端域名，禁止 "*"
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

logging:
  level:
    com.agent.platform: ${LOG_LEVEL:info}
